<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760">
  <defs>
    <style>
      .bg { fill: #f4f4f4; }
      .title { font: 700 26px 'Segoe UI', sans-serif; fill: #1f2937; }
      .section { font: 700 23px 'Segoe UI', sans-serif; fill: #111827; }
      .small { font: 600 14px 'Segoe UI', sans-serif; fill: #374151; }
      .tiny { font: 600 12px 'Segoe UI', sans-serif; fill: #374151; }
      .step { font: 700 30px 'Segoe UI', sans-serif; fill: #111827; }
      .panel { fill: #fff; stroke: #374151; stroke-width: 2; rx: 16; }
      .panel-red { fill: #fff; stroke: #ff6b3d; stroke-width: 2; rx: 16; }
      .panel-green { fill: #fff; stroke: #22c55e; stroke-width: 2; rx: 16; }
      .panel-purple { fill: #fff; stroke: #b24ae5; stroke-width: 2; rx: 16; }
      .panel-blue { fill: #fff; stroke: #3b82f6; stroke-width: 2; rx: 16; }
      .label-red { fill: #ff6b3d; font: 700 18px 'Segoe UI', sans-serif; }
      .label-green { fill: #16a34a; font: 700 18px 'Segoe UI', sans-serif; }
      .label-purple { fill: #8b5cf6; font: 700 18px 'Segoe UI', sans-serif; }
      .label-blue { fill: #2563eb; font: 700 18px 'Segoe UI', sans-serif; }
      .arrow { stroke: #374151; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dashed { stroke-dasharray: 8 8; }
      .note { fill: #fff; stroke: #374151; stroke-width: 1.5; }
      .dark { fill: #111827; }
      .muted { fill: #374151; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="760" class="bg"/>

  <rect x="20" y="20" width="1360" height="720" fill="#f5f5f5" stroke="#ff7a3d" stroke-width="3" rx="12"/>

  <!-- Top row: 1 -->
  <text x="80" y="70" class="step">1</text>
  <text x="120" y="72" class="title">Synthetic Conversation Dataset Generation Pipeline</text>

  <rect x="60" y="100" width="250" height="200" class="panel-red"/>
  <rect x="120" y="140" width="130" height="50" class="note"/>
  <text x="185" y="173" text-anchor="middle" class="tiny">Online Harassment</text>
  <text x="186" y="208" text-anchor="middle" class="tiny">Text Data From</text>
  <text x="186" y="230" text-anchor="middle" class="tiny">Instagram or Twitter</text>

  <rect x="70" y="250" width="220" height="110" class="panel-red"/>
  <text x="180" y="280" text-anchor="middle" class="small">Take down your @account</text>
  <text x="180" y="305" text-anchor="middle" class="small">xxx really suck.</text>
  <text x="180" y="332" text-anchor="middle" class="small">Those xxx people make me</text>
  <text x="180" y="350" text-anchor="middle" class="small">sick. I can't stand them.</text>

  <rect x="330" y="100" width="240" height="200" class="panel-red"/>
  <text x="450" y="138" text-anchor="middle" class="label-red">1.2 Online Harassment Definitions</text>
  <text x="450" y="170" text-anchor="middle" class="tiny">• Aggressive Confrontation</text>
  <text x="450" y="190" text-anchor="middle" class="tiny">• Flaming</text>
  <text x="450" y="210" text-anchor="middle" class="tiny">• Insult</text>
  <text x="450" y="230" text-anchor="middle" class="tiny">• Threat</text>
  <text x="450" y="250" text-anchor="middle" class="tiny">• Identity Attack</text>
  <text x="450" y="270" text-anchor="middle" class="tiny">• Sexual Harassment/Sexual Talk</text>

  <rect x="600" y="100" width="260" height="180" class="panel-blue"/>
  <text x="730" y="130" text-anchor="middle" class="label-blue">1.3 LLM Keyword Generator</text>
  <text x="730" y="175" text-anchor="middle" class="small">Generated Keywords:</text>
  <text x="730" y="205" text-anchor="middle" class="tiny">1. Homophobia</text>
  <text x="730" y="225" text-anchor="middle" class="tiny">2. Bigotry</text>
  <text x="730" y="245" text-anchor="middle" class="tiny">3. Threat</text>

  <rect x="610" y="290" width="250" height="215" class="panel-blue"/>
  <text x="735" y="325" text-anchor="middle" class="label-blue">1.4 LLM Scenario Generator</text>
  <text x="735" y="360" text-anchor="middle" class="small">Generated Scenarios:</text>
  <text x="735" y="390" text-anchor="middle" class="tiny">keywords: ...</text>
  <text x="735" y="410" text-anchor="middle" class="tiny">background: ...</text>
  <text x="735" y="430" text-anchor="middle" class="tiny">platform: ...</text>
  <text x="735" y="450" text-anchor="middle" class="tiny">victim: ...</text>
  <text x="735" y="470" text-anchor="middle" class="tiny">harasser persona: ...</text>

  <rect x="900" y="100" width="410" height="150" class="panel"/>
  <text x="1105" y="132" text-anchor="middle" class="label-red">1.5 Generated Multi-Turn</text>
  <text x="1105" y="155" text-anchor="middle" class="label-red">Conversations</text>
  <text x="1105" y="183" text-anchor="middle" class="small">Harasser: I am going to share</text>
  <text x="1105" y="203" text-anchor="middle" class="small">you with the whole school.</text>
  <text x="1105" y="223" text-anchor="middle" class="small">Victim: Why are you doing this?</text>

  <rect x="900" y="270" width="410" height="150" class="panel"/>
  <text x="1105" y="303" text-anchor="middle" class="label-blue">1.6 LLM Judge and Human</text>
  <text x="1105" y="326" text-anchor="middle" class="label-blue">Labelers for Evaluating</text>
  <text x="1105" y="349" text-anchor="middle" class="label-blue">Conversations</text>
  <text x="1105" y="385" text-anchor="middle" class="small">GPT-based judge scores each turn</text>
  <text x="1105" y="410" text-anchor="middle" class="small">across categories like aggressive</text>
  <text x="1105" y="435" text-anchor="middle" class="small">confrontation, threats, and refusal.</text>

  <!-- arrows -->
  <path d="M 310 220 L 330 220" class="arrow"/>
  <path d="M 570 220 L 600 220" class="arrow"/>
  <path d="M 860 220 L 900 220" class="arrow"/>
  <path d="M 1105 250 L 1105 270" class="arrow"/>
  <path d="M 735 290 L 735 260" class="arrow"/>

  <!-- Middle row section 2 -->
  <line x1="30" y1="520" x2="1370" y2="520" stroke="#a8b0ba" stroke-width="2" />

  <text x="98" y="560" class="step">2</text>
  <text x="139" y="562" class="section">Multi-Agent Design</text>

  <rect x="80" y="590" width="250" height="120" class="panel-red"/>
  <text x="205" y="620" text-anchor="middle" class="label-red">Toxic Memory</text>
  <text x="205" y="650" text-anchor="middle" class="tiny">“Harasser: I've been visiting your</text>
  <text x="205" y="668" text-anchor="middle" class="tiny">blog. You know my threats.”</text>

  <rect x="410" y="585" width="200" height="120" class="panel-red"/>
  <text x="510" y="618" text-anchor="middle" class="label-red">Harasser Agent</text>

  <rect x="640" y="585" width="210" height="120" class="panel-green"/>
  <text x="745" y="618" text-anchor="middle" class="label-green">Victim Agent</text>

  <rect x="920" y="585" width="260" height="120" class="panel"/>
  <text x="1050" y="618" text-anchor="middle" class="small">Model families</text>
  <text x="1050" y="650" text-anchor="middle" class="tiny">Qwen-3B / 32B</text>
  <text x="1050" y="668" text-anchor="middle" class="tiny">LLaMA / DeepSeek / Gemini</text>

  <!-- 3 Evaluation right -->
  <text x="1090" y="560" class="step">3</text>
  <text x="1130" y="562" class="section">Evaluation</text>

  <rect x="1095" y="590" width="235" height="120" class="panel-purple"/>
  <text x="1212" y="620" text-anchor="middle" class="label-purple">LLM Judge</text>
  <text x="1212" y="647" text-anchor="middle" class="tiny">GPT-4o</text>
  <text x="1212" y="665" text-anchor="middle" class="tiny">and other LLMs</text>

  <path d="M 330 640 H 410" class="arrow"/>
  <path d="M 610 640 H 640" class="arrow"/>
  <path d="M 850 640 H 920" class="arrow"/>

  <path d="M 990 585 L 990 560 L 1095 560" class="arrow"/>

  <!-- bottom labels -->
  <text x="30" y="745" class="tiny">Figure 1: Overview of the Online Harassment Agentic Benchmark.</text>
</svg>
